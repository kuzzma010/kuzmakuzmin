<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kuzma Kuzmin</title>
    <style>
      :root {
        color: #0a0a0a;
        background: #ffffff;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        font-size: 16px;
        line-height: 1.5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        color: #0a0a0a;
        background: #ffffff;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .hero {
        position: relative;
        min-height: 100vh;
        min-height: 100svh;
        overflow: hidden;
        padding: 32px 24px;
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }

      .hero__image {
        position: absolute;
        inset: 0;
        z-index: 0;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center;
      }

      .hero__content {
        position: relative;
        z-index: 1;
        width: min(980px, calc(100vw - 48px));
        margin-bottom: clamp(48px, 7vh, 92px);
        text-align: center;
      }

      .hero__name {
        margin: 0;
        font-size: clamp(4rem, 6.2vw, 6.25rem);
        font-weight: 700;
        line-height: 0.9;
        letter-spacing: 0;
        white-space: nowrap;
      }

      .hero__kicker {
        margin: 30px 0 0;
        font-size: clamp(1.25rem, 2vw, 1.6rem);
        font-weight: 500;
        line-height: 1.35;
      }

      .hero__text {
        max-width: 760px;
        margin: 18px auto 0;
        font-size: clamp(1.2rem, 2vw, 1.5rem);
        font-weight: 400;
        line-height: 1.5;
      }

      .links {
        margin-top: 50px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 14px;
      }

      .link-button {
        min-width: 170px;
        padding: 17px 28px;
        border: 2px solid #0a0a0a;
        border-radius: 999px;
        font-size: clamp(0.95rem, 1.3vw, 1.25rem);
        font-weight: 600;
        line-height: 1;
        text-align: center;
        transition: background-color 160ms ease, color 160ms ease;
      }

      .link-button:focus-visible {
        outline: 2px solid #0a0a0a;
        outline-offset: 4px;
      }

      @media (hover: hover) {
        .link-button:hover {
          color: #ffffff;
          background: #0a0a0a;
        }
      }

      @media (max-width: 640px) {
        .hero {
          min-height: 100dvh;
          padding: 20px;
        }

        .hero__content {
          width: min(100%, 430px);
          margin-bottom: 26px;
        }

        .hero__name {
          font-size: clamp(2.6rem, 13vw, 4rem);
          white-space: normal;
        }

        .hero__kicker {
          margin-top: 18px;
          font-size: 1rem;
        }

        .hero__text {
          margin-top: 12px;
          font-size: 0.95rem;
          line-height: 1.45;
        }

        .links {
          margin-top: 24px;
          gap: 10px;
        }

        .link-button {
          min-width: 0;
          flex: 1 1 120px;
          padding: 13px 18px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero" aria-label="Kuzma Kuzmin">
        <img class="hero__image" src="assets/hero.png?v=20260511-1008" alt="Kuzma Kuzmin creative technology portrait">
        <div class="hero__content">
          <h1 class="hero__name">Kuzma Kuzmin</h1>
          <p class="hero__kicker">Video · AI · Creative Technology</p>
          <p class="hero__text">
            I create visual projects, AI-generated content, and digital experiences for stage,
            brands, and media.
          </p>

          <div class="links" aria-label="Links">
            <a class="link-button" href="https://t.me/kuzmakuzmin">Telegram</a>
            <a class="link-button" href="https://instagram.com/kuzmakuzmin">Instagram</a>
            <a class="link-button" href="https://kuzmakuzmin.com">Portfolio</a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
