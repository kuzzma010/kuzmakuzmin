<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kuzma Kuzmin</title>
    <style>
      :root {
        color: #0a0a0a;
        background: #ffffff;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        font-size: 16px;
        line-height: 1.5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        color: #0a0a0a;
        background: #ffffff;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .hero {
        min-height: 100vh;
        padding: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .hero__image {
        display: block;
        width: 100%;
        height: calc(100vh - 64px);
        object-fit: contain;
        object-position: center;
      }

      .intro {
        max-width: 760px;
        margin: 0 auto;
        padding: 96px 24px 112px;
        text-align: center;
      }

      .intro__name {
        margin: 0;
        font-size: clamp(2.5rem, 7vw, 5.75rem);
        font-weight: 500;
        line-height: 0.95;
        letter-spacing: 0;
      }

      .intro__text {
        max-width: 560px;
        margin: 32px auto 0;
        font-size: clamp(1.05rem, 2vw, 1.35rem);
        font-weight: 400;
        line-height: 1.65;
      }

      .links {
        margin-top: 48px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
      }

      .link-button {
        min-width: 148px;
        padding: 14px 22px;
        border: 1px solid #0a0a0a;
        border-radius: 999px;
        font-size: 0.95rem;
        font-weight: 500;
        line-height: 1;
        text-align: center;
        transition: background-color 160ms ease, color 160ms ease;
      }

      .link-button:focus-visible {
        outline: 2px solid #0a0a0a;
        outline-offset: 4px;
      }

      @media (hover: hover) {
        .link-button:hover {
          color: #ffffff;
          background: #0a0a0a;
        }
      }

      @media (max-width: 640px) {
        .hero {
          padding: 20px;
        }

        .hero__image {
          height: calc(100vh - 40px);
        }

        .intro {
          padding: 72px 20px 88px;
        }

        .intro__text {
          margin-top: 24px;
        }

        .links {
          margin-top: 36px;
          flex-direction: column;
          align-items: stretch;
        }

        .link-button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero" aria-label="Главное изображение">
        <img class="hero__image" src="assets/hero.png" alt="Портрет или работа автора">
      </section>

      <section class="intro" aria-label="Обо мне">
        <h1 class="intro__name">Kuzma Kuzmin</h1>
        <p class="intro__text">
          Я создаю сайты, визуальные проекты и цифровые решения для людей,
          брендов и творческих команд.
        </p>

        <div class="links" aria-label="Ссылки">
          <a class="link-button" href="https://t.me/kuzmakuzmin">Telegram</a>
          <a class="link-button" href="https://instagram.com/kuzmakuzmin">Instagram</a>
          <a class="link-button" href="https://kuzmakuzmin.com">Portfolio</a>
        </div>
      </section>
    </main>
  </body>
</html>
